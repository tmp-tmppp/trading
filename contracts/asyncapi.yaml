asyncapi: 3.0.0
info:
  title: Chance trading events
  version: 0.2.0
  description: |
    Integration events published by the trading service to NATS JetStream, and the events it consumes.

    - Format: CloudEvents 1.0, structured JSON mode. The message body is the whole CloudEvent.
    - Stream `TRADING`: subjects `chance.trading.>`, file storage, limits retention, 30 days by default (STREAM_MAX_AGE_DAYS), duplicate window
      2 minutes. The NATS message header `Nats-Msg-Id` carries the event `id`.
    - Subject of a message: `chance.trading.<Event>.<tenantId>`; CloudEvents subject `market/<marketId>` or
      `withdrawal/<withdrawalId>`.
    - Delivery is at least once; the outbox relay publishes in the order of writing, so the events of one market keep
      their order. Consumers deduplicate by the event `id`, take the tenant from `tenantid` and ignore unknown fields.
    - **Units.** `amount` is whole credits (payments' unit). Every `...Micro` field is an exact integer in micro-units:
      microcredits (1 credit = 1 000 000), microshares (1 share = 1 000 000), prices in microcredits per share.
    - The ledger's own event types never leave trading (DM-08); these are written into the outbox in the same
      transaction as the ledger events (REL-01). Events carry ids, never names or e-mails (DM-14).
    - Consumed, each through a durable pull consumer named `trading` and the inbox in the same transaction as the
      change (REL-02): TenantCreated (stream `TENANTS`), MarketOpened, MarketClosed, MarketResolved (stream `MARKETS`),
      DepositSucceeded and WithdrawalFailed (stream `PAYMENTS`).
defaultContentType: application/json
servers:
  nats:
    host: nats:4222
    protocol: nats
    description: NATS server with JetStream, reached by its Kubernetes service name (localhost:4222 in local runs)

channels:
  tradeExecuted:
    address: chance.trading.TradeExecuted.{tenantId}
    description: A trader bought from the market maker's offers; market-data adds a price point, the bot re-prices (EP-1)
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      TradeExecuted:
        $ref: '#/components/messages/TradeExecuted'
  marketFunded:
    address: chance.trading.MarketFunded.{tenantId}
    description: The creator's funding became pairs in the market's bot account (audit, M3)
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      MarketFunded:
        $ref: '#/components/messages/MarketFunded'
  marketSettled:
    address: chance.trading.MarketSettled.{tenantId}
    description: Every winning share of a resolved market is paid and the creator got back what the bot account held
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      MarketSettled:
        $ref: '#/components/messages/MarketSettled'
  withdrawalRefunded:
    address: chance.trading.WithdrawalRefunded.{tenantId}
    description: The credits of a failed withdrawal are back (payments' proposal, FL-C step 7); payments marks it refunded
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      WithdrawalRefunded:
        $ref: '#/components/messages/WithdrawalRefunded'
  tenantCreated:
    address: chance.tenants.TenantCreated.{tenantId}
    description: Consumed from the stream TENANTS; trading creates and migrates the tenant's schema
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      TenantCreated:
        $ref: '#/components/messages/TenantCreated'
  marketLifecycle:
    address: chance.markets.{event}.{tenantId}
    description: |
      Consumed from the stream MARKETS with one consumer, so the events of a market are handled in order: MarketOpened
      (copy the market, EP-2), MarketClosed (stop orders, cancel the bot's offers), MarketResolved (cancel the offers,
      settle once, publish MarketSettled). Each changes the copy only when its `version` is higher (DM-04).
      MarketResolved's `outcome` is `YES`, `NO` or `INVALID` (UC-16): YES and NO pay the winning shares; INVALID voids
      every share, refunds every trader's net payment (buys minus what sales returned, never below zero) and returns the
      rest of the market to the creator. Any other value is a contract violation (the message is parked).
    parameters:
      event:
        enum: [MarketOpened, MarketClosed, MarketResolved]
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      MarketOpened:
        $ref: '#/components/messages/MarketOpened'
      MarketClosed:
        $ref: '#/components/messages/MarketClosed'
      MarketResolved:
        $ref: '#/components/messages/MarketResolved'
  payments:
    address: chance.payments.{event}.{tenantId}
    description: Consumed from the stream PAYMENTS; DepositSucceeded credits once per deposit, WithdrawalFailed refunds once per withdrawal
    parameters:
      event:
        enum: [DepositSucceeded, WithdrawalFailed]
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      DepositSucceeded:
        $ref: '#/components/messages/DepositSucceeded'
      WithdrawalFailed:
        $ref: '#/components/messages/WithdrawalFailed'

operations:
  publishTradeExecuted:
    action: send
    channel:
      $ref: '#/channels/tradeExecuted'
    summary: Written in the transaction of the trade
  publishMarketFunded:
    action: send
    channel:
      $ref: '#/channels/marketFunded'
    summary: Written in the transaction of the funding call
  publishMarketSettled:
    action: send
    channel:
      $ref: '#/channels/marketSettled'
    summary: Written in the transaction that settles the market on MarketResolved
  publishWithdrawalRefunded:
    action: send
    channel:
      $ref: '#/channels/withdrawalRefunded'
    summary: Written in the transaction that refunds a failed withdrawal, once per withdrawal id
  receiveTenantCreated:
    action: receive
    channel:
      $ref: '#/channels/tenantCreated'
  receiveMarketLifecycle:
    action: receive
    channel:
      $ref: '#/channels/marketLifecycle'
  receivePayments:
    action: receive
    channel:
      $ref: '#/channels/payments'

components:
  messages:
    TradeExecuted:
      name: TradeExecuted
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/TradeExecutedEvent'
    MarketFunded:
      name: MarketFunded
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/MarketFundedEvent'
    MarketSettled:
      name: MarketSettled
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/MarketSettledEvent'
    WithdrawalRefunded:
      name: WithdrawalRefunded
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/WithdrawalRefundedEvent'
    TenantCreated:
      name: TenantCreated
      title: Tenant created (consumed)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ConsumedEvent'
    MarketOpened:
      name: MarketOpened
      title: Market opened (consumed; markets' contract has the full schema)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ConsumedEvent'
    MarketClosed:
      name: MarketClosed
      title: Market closed (consumed)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ConsumedEvent'
    MarketResolved:
      name: MarketResolved
      title: Market resolved (consumed)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ConsumedEvent'
    DepositSucceeded:
      name: DepositSucceeded
      title: Deposit succeeded (consumed; payments' contract has the full schema)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ConsumedEvent'
    WithdrawalFailed:
      name: WithdrawalFailed
      title: Withdrawal failed (consumed)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ConsumedEvent'

  schemas:
    NatsHeaders:
      type: object
      required: [Nats-Msg-Id]
      properties:
        Nats-Msg-Id:
          type: string
          format: uuid
          description: Equals the CloudEvent id; JetStream drops a repeated id inside the duplicate window
    Side:
      type: string
      enum: ['YES', 'NO']
    Outcome:
      type: string
      enum: ['YES', 'NO', 'INVALID']
      description: The outcome of a resolved market; INVALID (UC-16) pays no winners and refunds the stakes
    Micro:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Amount:
      type: integer
      minimum: 1
      maximum: 1000000
      description: Whole credits (payments' unit)
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, tenantid, correlationid, causationid, data]
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
          description: UUIDv7, the deduplication key
        source:
          type: string
          const: /chance/trading
        type:
          type: string
          pattern: '^si\.chance\.trading\.[A-Za-z]+\.v[0-9]+$'
        subject:
          type: string
          pattern: '^(market|withdrawal)/'
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        tenantid:
          type: string
          format: uuid
        correlationid:
          type: string
          minLength: 1
        causationid:
          type: string
          minLength: 1
          description: The request or the consumed event that caused this event
        data:
          type: object
    TradeExecutedData:
      type: object
      additionalProperties: false
      required: [tradeId, marketId, userId, side, sharesMicro, costMicro, averagePriceMicro, lastPriceMicro, yesPriceMicro, tradeSequence, executedAt]
      description: |
        Prices are of the side bought, except `yesPriceMicro`. For market-data (plan 6.3): `price_yes` is
        `yesPriceMicro` / 1 000 000; the trade's volume in credits is `costMicro` (microcredits) and in shares
        `sharesMicro` (microshares).

        A sale (UC-08, `kind: sale`) of S shares of one side buys S shares of the other side from the market maker's
        offers and redeems the S pairs, so its event describes that buy: `side` is the side bought (the side other
        than the one sold), `sharesMicro` = S, `costMicro` what those shares cost, the prices those of the side bought.
        The bot's book and the price move exactly as for a buy of `side`, so a reader that ignores `kind` stays
        right; the seller received `sharesMicro - costMicro`. The credit volume of a sale is `costMicro`, the credits
        paid into the market maker's offers, as for a buy (market-data counts it so).
      properties:
        tradeId:
          type: string
          format: uuid
        marketId:
          type: string
          format: uuid
        userId:
          type: string
          description: Subject of the trader (the buyer; for a sale the seller)
        side:
          $ref: '#/components/schemas/Side'
        kind:
          type: string
          enum: [buy, sale]
          description: |
            Optional, added with UC-08 (additive): `buy` for an order, `sale` for a sale. trading always sends it; an
            event without it is a buy.
        sharesMicro:
          $ref: '#/components/schemas/Micro'
        costMicro:
          $ref: '#/components/schemas/Micro'
        averagePriceMicro:
          type: integer
          minimum: 1
          maximum: 999999
        lastPriceMicro:
          type: integer
          minimum: 10000
          maximum: 990000
          description: The price of the most expensive level the trade used, of the side bought
        yesPriceMicro:
          type: integer
          minimum: 10000
          maximum: 990000
          description: |
            `lastPriceMicro` as the price of YES: equal for a YES buy, 1000000 minus it for a NO buy (a YES and a NO
            share together are worth exactly one credit). A NO buy at 300000 is a YES price of 700000.
        tradeSequence:
          type: integer
          minimum: 1
          description: The market's trade sequence after this trade (the bot's next basedOnSequence, market-data's order)
        executedAt:
          type: string
          format: date-time
    MarketFundedData:
      type: object
      additionalProperties: false
      required: [marketId, creatorId, amount, fundedAt]
      properties:
        marketId:
          type: string
          format: uuid
        creatorId:
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
        fundedAt:
          type: string
          format: date-time
    MarketSettledData:
      type: object
      additionalProperties: false
      required: [marketId, outcome, creatorId, payoutTotalMicro, payoutCount, returnedToCreatorMicro, settledAt]
      properties:
        marketId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/Outcome'
        creatorId:
          type: string
        payoutTotalMicro:
          $ref: '#/components/schemas/Micro'
          description: |
            YES or NO: paid to users for winning shares. INVALID: the refunds, each trader's net payment into the market
            (what its buys cost minus what its sales returned, never below zero).
        payoutCount:
          type: integer
          minimum: 0
          description: Users who received a payout (YES, NO) or a refund (INVALID) above zero
        returnedToCreatorMicro:
          $ref: '#/components/schemas/Micro'
          description: |
            What went back to the creator from the market's bot account. INVALID: the rest after the refunds; the funding
            to the microcredit when no trader sold (UC-08) at a profit. payoutTotalMicro plus this is what entered the
            market: the funding plus the traders' net payments.
        settledAt:
          type: string
          format: date-time
    WithdrawalRefundedData:
      type: object
      additionalProperties: false
      required: [withdrawalId, userId, amount, refundedAt]
      properties:
        withdrawalId:
          type: string
          format: uuid
        userId:
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
        refundedAt:
          type: string
          format: date-time
    TradeExecutedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.trading.TradeExecuted.v1
            subject:
              pattern: '^market/'
            data:
              $ref: '#/components/schemas/TradeExecutedData'
    MarketFundedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.trading.MarketFunded.v1
            subject:
              pattern: '^market/'
            data:
              $ref: '#/components/schemas/MarketFundedData'
    MarketSettledEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.trading.MarketSettled.v1
            subject:
              pattern: '^market/'
            data:
              $ref: '#/components/schemas/MarketSettledData'
    WithdrawalRefundedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.trading.WithdrawalRefunded.v1
            subject:
              pattern: '^withdrawal/'
            data:
              $ref: '#/components/schemas/WithdrawalRefundedData'
    ConsumedEvent:
      type: object
      description: |
        What trading reads of a consumed event (the publisher's contract has the full schema): the envelope below and the
        data fields src/domain/consumed.ts names. Unknown fields are ignored; a malformed event is logged and
        acknowledged; `data.tenantId`, when present, must equal `tenantid`.
      required: [specversion, id, type, tenantid]
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
          description: The inbox deduplication key
        type:
          type: string
          enum:
            - si.chance.tenants.TenantCreated.v1
            - si.chance.markets.MarketOpened.v1
            - si.chance.markets.MarketClosed.v1
            - si.chance.markets.MarketResolved.v1
            - si.chance.payments.DepositSucceeded.v1
            - si.chance.payments.WithdrawalFailed.v1
        tenantid:
          type: string
          format: uuid
        correlationid:
          type: string
        data:
          type: object
