# One Service, three ports. The gateway routes only the public one; the NetworkPolicy (when enabled) admits markets,
# payments and market-maker to the internal one, payments alone to the gRPC one, and nobody else.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trading.fullname" . }}
  labels:
    {{- include "trading.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "trading.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: internal
      port: {{ .Values.service.internalPort }}
      targetPort: internal
      protocol: TCP
    # The gRPC debit of payments (HTTP/2 without TLS, like the internal port).
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
